kind = "web"
previewPath = "/"
title = "SITA Health"
description = "A responsive women's health companion for cycle tracking, mood insights, reproductive health modes, and a supportive SITA assistant."
version = "1.0.0"
id = "artifacts/sita-health"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22767

[services.development]
run = "pnpm --filter @workspace/sita-health run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sita-health", "run", "build" ]
serve = "static"
publicDir = "artifacts/sita-health/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22767"
BASE_PATH = "/"
